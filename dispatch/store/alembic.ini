# Alembic config for dispatch v2. Run from the repo root:
#   alembic -c dispatch/store/alembic.ini upgrade head
# The database URL comes from DATABASE_URL (see dispatch/core/config.py), not from this file.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .

[loggers]
keys = root,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARNING
handlers = console
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
